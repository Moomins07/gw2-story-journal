<!doctype html>
<html lang="en">
  <head>
    <!-- Support readable text and layouts on different screen sizes. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle — Our Story</title>
  </head>
  <body>
    <!-- Start with plain content to verify the Flask route works. -->
    <h1>Our Chronicle</h1>
    <p>A place for the chapters of our journey.</p>
    <ul>
      {% for chapter in chapters %}
      <!-- Display the mission title and its character-specific progress. -->
      <li>
        {{ chapter.title }} {% if chapter.completed %} — Complete {% else %} —
        Not reported complete {% endif %}
      </li>
      {% endfor %}
    </ul>
  </body>
</html>
