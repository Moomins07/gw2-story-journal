<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Story — GW2 Journal</title>
    <script src="{{ url_for('static', filename='js/intro.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />
    <script defer src="{{ url_for('static', filename='js/atmosphere.js') }}"></script>
  </head>
  <body class="isolate min-h-screen bg-zinc-950 text-stone-100">
    <!-- A once-per-session cinematic; the homepage remains usable without JavaScript. -->
    <div id="story-intro" class="story-intro" role="dialog" aria-modal="true" aria-label="Welcome to Our Story" hidden>
      <div class="intro-art" aria-hidden="true">
        <img src="{{ url_for('static', filename='images/wallpaper.png') }}" alt="" class="absolute inset-0 h-full w-full object-cover" />
      </div>
      <div class="intro-embers absolute inset-0 overflow-hidden" aria-hidden="true"></div>
      <div class="intro-halo" aria-hidden="true"></div>
      <div class="intro-title relative px-6 text-center">
        <svg class="intro-crest mx-auto h-32 w-32 text-amber-200 sm:h-44 sm:w-44" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <!-- Original dragon-inspired heraldry, drawn as glowing gold strokes. -->
          <circle class="intro-ring" cx="100" cy="100" r="85" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="2 9" />
          <path class="crest-stroke" pathLength="1" d="M100 12 109 27 100 42 91 27Z M188 100 173 109 158 100 173 91Z M100 188 109 173 100 158 91 173Z M12 100 27 109 42 100 27 91Z" stroke="currentColor" stroke-width="1" />
          <path class="crest-stroke" pathLength="1" d="M144 57C124 31 81 39 63 65C43 94 52 125 78 141C99 154 128 147 141 128C152 111 150 91 139 81L129 73 145 68 132 58 116 64 109 53 108 73 96 85 111 88 114 101 123 93C132 108 124 126 108 130C86 136 67 120 66 101C66 79 82 65 99 63" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path class="crest-stroke crest-stroke--detail" pathLength="1" d="M66 74 51 70 58 85 45 91 58 101 49 115 66 119 M139 124 157 124 143 138 148 150 130 147 M119 78 124 76 M76 132 72 149 87 143" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="intro-kicker mt-7 text-[10px] uppercase tracking-[0.45em] text-amber-200/80">Two souls. One journey.</p>
        <p class="intro-wordmark mt-4 font-serif text-5xl tracking-[0.12em] text-stone-100 sm:text-7xl">OUR STORY</p>
        <p class="intro-caption mt-5 text-xs tracking-[0.22em] text-stone-300/75">A chronicle of Tyria</p>
      </div>
      <button id="skip-intro" type="button" class="absolute bottom-8 right-6 rounded-sm border border-amber-100/25 bg-zinc-950/40 px-5 py-3 text-[10px] uppercase tracking-[0.2em] text-amber-100/80 backdrop-blur-sm transition-colors hover:border-amber-200/70 hover:text-amber-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-200 sm:right-10">
        Skip intro <span aria-hidden="true">&#8594;</span>
      </button>
    </div>
    <!-- All atmosphere layers are decorative and leave controls clickable. -->
    <div id="atmosphere" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="scene-frame absolute -inset-8">
        <div class="scene-stage">
          <!-- Only distant scenery responds to parallax. -->
          <div class="landscape-depth absolute inset-0">
            <img id="landscape" src="{{ url_for('static', filename='images/wallpaper-distance.png') }}"
              data-fallback="{{ url_for('static', filename='images/wallpaper.png') }}" alt=""
              class="absolute inset-0 h-full w-full motion-safe:animate-wallpaper-drift" fetchpriority="high" />
            <div class="island-hover island-hover--left absolute inset-0">
              <img src="{{ url_for('static', filename='images/floating-islands.png') }}" alt=""
                class="island-art island-art--left" />
            </div>
            <div class="island-hover island-hover--right absolute inset-0">
              <img src="{{ url_for('static', filename='images/floating-islands.png') }}" alt=""
                class="island-art island-art--right" />
            </div>
          </div>
          <!-- Characters, ground and nearby foliage form one stationary foreground. -->
          <img id="charr-foreground" src="{{ url_for('static', filename='images/charr-ledge-foreground.png') }}"
            alt="" class="foreground-art absolute inset-0 h-full w-full" />
          <div class="sunlight absolute inset-0"></div>
        </div>
      </div>
      <div class="absolute inset-0 bg-linear-to-r from-zinc-950/85 via-zinc-950/40 to-zinc-950/5"></div>
      <div class="absolute inset-0 bg-linear-to-t from-zinc-950/90 via-transparent to-zinc-950/30"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_30%,rgba(9,9,11,0.5)_100%)]"></div>
      <div class="mist absolute -inset-x-1/2 bottom-0 h-1/2 opacity-20 blur-3xl motion-safe:animate-mist-drift"></div>
      <div class="pointer-glow absolute inset-0 opacity-0 transition-opacity duration-700"></div>
      <canvas id="ember-field" class="absolute inset-0 h-full w-full"></canvas>
    </div>

    <header class="mx-auto flex max-w-7xl items-center justify-between border-b border-amber-100/15 px-6 py-6 md:px-12">
      <a href="{{ url_for('home') }}" class="font-serif text-lg tracking-[0.2em] text-stone-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-200">OUR STORY</a>
      <span class="text-[10px] uppercase tracking-[0.3em] text-amber-100/70">A journal of Tyria</span>
    </header>

    <main class="mx-auto flex min-h-[calc(100svh-80px)] max-w-7xl flex-col justify-center px-6 py-16 md:px-12">
      <section class="max-w-xl motion-safe:animate-hero-reveal">
        <p class="flex items-center gap-3 text-[10px] uppercase tracking-[0.35em] text-amber-200/85">
          <span class="h-px w-8 bg-amber-200/60" aria-hidden="true"></span>
          Our journey through Tyria
        </p>
        <h1 class="mt-6 font-serif text-6xl leading-[1.05] tracking-wide text-stone-100 drop-shadow-lg sm:text-8xl">Our Story</h1>
        <div class="mt-7 flex max-w-72 items-center gap-3 text-amber-200/70" aria-hidden="true">
          <span class="h-px flex-1 bg-linear-to-r from-amber-200/70 to-amber-200/20"></span>
          <span class="h-2 w-2 rotate-45 border border-amber-200/80"></span>
          <span class="h-px w-12 bg-linear-to-r from-amber-200/40 to-transparent"></span>
        </div>
        <p class="mt-7 max-w-sm text-base leading-7 text-stone-200/85 sm:text-lg">Two Charr. One shared journey.<br />The chapters we complete. The memories we keep.</p>
      <button
        id="load-chapters"
        class="group mt-8 inline-flex min-h-13 cursor-pointer items-center justify-center gap-[0.85rem] rounded-[5px] border border-[#c9a365] bg-linear-135 from-[#29251f] to-[#17191c] px-8 py-[0.8rem] font-serif text-[1.05rem] leading-[1.4] text-[#f5dfb2] shadow-[inset_0_0_0_1px_rgb(244_214_158_/_10%),0_4px_16px_rgb(0_0_0_/_25%)] transition-[border-color,box-shadow,transform] duration-180 hover:border-[#efd09a] hover:shadow-[inset_0_0_0_1px_rgb(244_214_158_/_18%),0_0_20px_rgb(201_163_101_/_18%)] motion-safe:hover:-translate-y-px active:translate-y-0 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#f5dfb2] motion-reduce:transition-none"
        type="button"
        aria-controls="chapters"
      >
        <span>Load chapters</span>
        <span
          class="transition-transform duration-180 motion-safe:group-hover:translate-x-[3px] motion-reduce:transition-none"
          aria-hidden="true"
          >&#8594;</span
        >
      </button>
        <div id="chapters" class="mt-8" aria-live="polite"></div>
      </section>
      <p class="mt-16 flex items-center gap-3 text-[10px] uppercase tracking-[0.25em] text-stone-300/65">
        <span class="h-1.5 w-1.5 rounded-full bg-amber-200 shadow-[0_0_12px_#fde68a]" aria-hidden="true"></span>
        Every adventure leaves a story
      </p>
    </main>
  </body>
</html>
