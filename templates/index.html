<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Our Story — GW2 Journal</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />
  </head>
  <body class="min-h-screen bg-zinc-950 text-stone-100">
    <!-- Decorative wallpaper and shading keep the foreground readable. -->
    <div class="pointer-events-none fixed inset-0" aria-hidden="true">
      <img
        src="{{ url_for('static', filename='images/wallpaper.png') }}"
        alt=""
        class="h-full w-full object-cover object-center"
        fetchpriority="high"
      />
      <div
        class="absolute inset-0 bg-linear-to-r from-zinc-950/80 via-zinc-950/35 to-zinc-950/10"
      ></div>
    </div>
    <main class="relative mx-auto max-w-5xl px-6 py-24">
      <p class="text-sm uppercase tracking-widest text-amber-300">
        Our journey through Tyria
      </p>

      <h1 class="mt-4 text-6xl font-semibold">Our Story</h1>

      <p class="mt-6 text-lg text-stone-400">
        Our shared Guild Wars 2 story journal.
      </p>
      <!-- Wire this button to /api/chapters in the JavaScript learning step. -->
      <button
        id="load-chapters"
        class="group mt-8 inline-flex min-h-13 cursor-pointer items-center justify-center gap-[0.85rem] rounded-[5px] border border-[#c9a365] bg-linear-135 from-[#29251f] to-[#17191c] px-8 py-[0.8rem] font-serif text-[1.05rem] leading-[1.4] text-[#f5dfb2] shadow-[inset_0_0_0_1px_rgb(244_214_158_/_10%),0_4px_16px_rgb(0_0_0_/_25%)] transition-[border-color,box-shadow,transform] duration-180 hover:border-[#efd09a] hover:shadow-[inset_0_0_0_1px_rgb(244_214_158_/_18%),0_0_20px_rgb(201_163_101_/_18%)] motion-safe:hover:-translate-y-px active:translate-y-0 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#f5dfb2] motion-reduce:transition-none"
        type="button"
        aria-controls="chapters"
      >
        <span>Load chapters</span>
        <span
          class="transition-transform duration-180 motion-safe:group-hover:translate-x-[3px] motion-reduce:transition-none"
          aria-hidden="true"
          >&#8594;</span
        >
      </button>
      <div id="chapters" class="mt-8" aria-live="polite"></div>
    </main>
  </body>
</html>
